      async function removeMemberPhoto(photoId) {
        const errorBox = document.getElementById("photos-error");
        if (!photoId) {
          return;
        }
        if (errorBox) errorBox.textContent = "";
        setPhotoButtonsDisabled(true);
        try {
          const result = await api("photos", {
            mode: "remove",
            photo_id: photoId,
          });
          document.getElementById("photos-content").innerHTML = renderPhotosContent(result.photos || {});
          bindPhotoActions(result.photos || {});
        } catch (error) {
          if (errorBox) errorBox.textContent = "Photo could not be removed.";
          setPhotoButtonsDisabled(false);
        }
      }

      function setPhotoButtonsDisabled(disabled) {
        document.querySelectorAll("[data-photo-upload]").forEach((button) => {
          button.disabled = disabled;
        });
        document.querySelectorAll("[data-photo-remove]").forEach((button) => {
          if (disabled) {
            if (!button.disabled) {
              button.dataset.reenable = "true";
              button.disabled = true;
            }
            return;
          }
          if (button.dataset.reenable === "true") {
            button.disabled = false;
            delete button.dataset.reenable;
          }
        });
        if (disabled) {
          document.querySelectorAll("[data-photo-face]").forEach((button) => {
            if (!button.disabled) {
              button.dataset.reenable = "true";
              button.disabled = true;
            }
          });
          return;
        }
        document.querySelectorAll("[data-photo-face][data-reenable='true']").forEach((button) => {
          button.disabled = false;
          delete button.dataset.reenable;
        });
      }

      function isFounderPhotoModel(photos) {
        return String(photos?.photo_model || "").toLowerCase() === "founder_optional";
      }

      function sleep(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function downloadDataExport(member) {
        const status = document.getElementById("privacy-export-status");
        const button = document.getElementById("privacy-export");
        if (status) status.textContent = "";
        if (button) {
          button.disabled = true;
          button.textContent = "Preparing...";
        }
        try {
          const result = await api("dsar", { mode: "export" });
          const exportData = result.export || {};
          const blob = new Blob([JSON.stringify(exportData, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `presttige-data-export-${safeFilePart(member?.lead_id || "member")}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          if (status) status.textContent = "Your export has been prepared.";
        } catch (error) {
          if (status) status.textContent = "Data export could not be prepared right now.";
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = "Download data export";
          }
        }
      }

      async function submitErasureRequest(event) {
        event.preventDefault();
        const confirmation = readFormValue("privacy-erase-confirmation");
        const checked = document.getElementById("privacy-erase-check")?.checked === true;
        const status = document.getElementById("privacy-erase-status");
        const button = document.getElementById("privacy-erase-submit");
        if (status) status.textContent = "";

        if (!checked || confirmation !== DSAR_ERASURE_CONFIRMATION) {
          if (status) status.textContent = "Confirm the erasure request with the exact phrase.";
          return;
        }

        button.disabled = true;
        button.textContent = "Erasing...";
        try {
          await api("dsar", {
            mode: "erase",
            confirmed: true,
            confirmation,
          });
          renderLogin("Your account erasure request has been completed where the law allows. A confirmation email has been sent.");
        } catch (error) {
          if (status) status.textContent = "Erasure could not be completed right now.";
          button.disabled = false;
          button.textContent = "Erase account data";
        }
      }

      async function submitProfile(event, member) {
        event.preventDefault();
        const button = document.getElementById("profile-submit");
        const errorBox = document.getElementById("profile-error");
        const payload = profilePayloadFromForm(member);
        const errors = validateProfilePayload(payload);

        errorBox.textContent = "";
        if (errors.length) {
          errorBox.textContent = `Profile needs ${errors.join(", ")}.`;
          return;
        }

        button.disabled = true;
        button.textContent = "Saving...";
        try {
          const result = await api("profile", payload);
          renderMemberShell(result.member || member, "profile");
        } catch (error) {
          errorBox.textContent = "Profile could not be saved.";
          button.disabled = false;
          button.textContent = "Save profile";
        }
      }

      function profilePayloadFromForm(member) {
        const current = profileOf(member);
        return {
          profile: {
            phone_country: readFormValue("profile-phone-country") || current.phone_country,
            phone: readFormValue("profile-phone") || current.phone,
            age: readFormValue("profile-age") || current.age,
            country: readFormValue("profile-country") || current.country,
            city: readFormValue("profile-city") || current.city,
            instagram: readFormValue("profile-instagram"),
            linkedin: readFormValue("profile-linkedin"),
            tiktok: readFormValue("profile-tiktok"),
            website: readFormValue("profile-website"),
            occupation: readFormValue("profile-occupation"),
            company: readFormValue("profile-company"),
            bio: readFormValue("profile-bio"),
          },
          interests: {
            lifestyle: readFormValue("interest-lifestyle"),
            business: readFormValue("interest-business"),
            travel: readFormValue("interest-travel"),
            culture: readFormValue("interest-culture"),
            wellbeing: readFormValue("interest-wellbeing"),
            notes: readFormValue("interest-notes"),
          },
        };
      }

      function validateProfilePayload(payload) {
        const profile = payload.profile || {};
        const required = [
          ["phone_country", "phone code"],
          ["phone", "phone"],
          ["age", "age"],
          ["country", "country"],
          ["city", "city"],
          ["instagram", "Instagram"],
          ["bio", "short introduction"],
        ];
        const errors = required
          .filter(([key]) => !String(profile[key] || "").trim())
          .map(([, label]) => label);

        if (profile.bio && profile.bio.length < 50) {
          errors.push("a longer short introduction");
        }
        if (profile.website && !isHttpUrl(profile.website)) {
          errors.push("a valid website URL");
        }
        if (profile.linkedin && !isHttpUrl(profile.linkedin)) {
          errors.push("a valid LinkedIn URL");
        }
        return errors;
      }

      function isSectionLocked(section, isValidated) {
        return Boolean(section.requiresValidation || VALIDATION_REQUIRED_SECTIONS.has(section.key)) && !isValidated;
      }

      function isMemberValidated(member) {
        return member?.validation?.is_validated === true ||
          String(member?.validation_status || "").toLowerCase() === "validated";
      }

      function normalizeDiscoveryStatus(value) {
        const status = value && typeof value === "object" ? value : {};
        return {
          master_enabled: status.master_enabled === true,
          eligible: status.eligible === true,
          visible: status.visible === true,
          member_id: String(status.member_id || ""),
          founder_invisible_by_default: status.founder_invisible_by_default === true,
          founder_visibility_control: status.founder_visibility_control === true,
        };
      }

      function renderPasswordPending(payload) {
        const activationUrl = payload.activation_url || "";
        renderEntry(`
          <p class="eyebrow">Account Setup</p>
          <h2 class="title">Complete setup.</h2>
          <p class="copy">Your account setup is not complete yet. Complete the password step before entering the member area.</p>
          <div class="actions">
            ${activationUrl ? `<a class="button" href="${escapeHtml(activationUrl)}">Set password</a>` : ""}
            <button class="button button--secondary" type="button" data-login>Back to login</button>
          </div>
        `);
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
      }

      function renderForgot() {
        renderEntry(`
          <p class="eyebrow">Password Reset</p>
          <h2 class="title">Reset access.</h2>
          <p class="copy">Enter your member email. If the account can be reset, instructions will be sent.</p>
          <form id="forgot-form" class="form" novalidate>
            <div class="field">
              <label for="forgot-email">Email</label>
              <input id="forgot-email" type="email" autocomplete="username" required>
            </div>
            <p id="forgot-message" class="hint"></p>
            <div class="actions">
              <button id="forgot-submit" class="button" type="submit">Send reset</button>
              <button class="button button--secondary" type="button" data-login>Back to login</button>
            </div>
          </form>
          <div class="notice">
            Already have a reset code?
            <button class="link-button" type="button" data-reset-code>Enter code</button>
          </div>
        `);
        document.getElementById("forgot-form").addEventListener("submit", submitForgot);
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
        app.querySelector("[data-reset-code]").addEventListener("click", renderResetCode);
      }

      async function submitForgot(event) {
        event.preventDefault();
        const email = document.getElementById("forgot-email").value.trim();
        const message = document.getElementById("forgot-message");
        const button = document.getElementById("forgot-submit");
        button.disabled = true;
        button.textContent = "Sending...";
        try {
          const result = await api("forgot", { email });
          message.textContent = result.message || "If this account can be reset, instructions have been sent.";
        } catch (error) {
          message.textContent = "If this account can be reset, instructions have been sent.";
        } finally {
          button.disabled = false;
          button.textContent = "Send reset";
        }
      }

      function renderResetCode() {
        renderEntry(`
          <p class="eyebrow">Password Reset</p>
          <h2 class="title">Enter reset code.</h2>
          <p class="copy">Use the code sent to your email and choose a new password.</p>
          <form id="reset-form" class="form" novalidate>
            <div class="field">
              <label for="reset-email">Email</label>
              <input id="reset-email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="reset-code">Reset code</label>
              <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
            </div>
            <div class="field">
              <label for="reset-password">New password</label>
              <input id="reset-password" type="password" autocomplete="new-password" minlength="14" required>
              <p class="hint">Use at least 14 characters, with uppercase, lowercase, a number and a symbol.</p>
            </div>
            <p id="reset-error" class="hint error-text"></p>
            <div class="actions">
              <button id="reset-submit" class="button" type="submit">Reset password</button>
              <button class="button button--secondary" type="button" data-login>Back to login</button>
            </div>
          </form>
        `);
        document.getElementById("reset-form").addEventListener("submit", submitReset);
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
      }

      async function submitReset(event) {
        event.preventDefault();
        const email = document.getElementById("reset-email").value.trim();
        const code = document.getElementById("reset-code").value.trim();
        const password = document.getElementById("reset-password").value;
        const errorBox = document.getElementById("reset-error");
        const button = document.getElementById("reset-submit");
        const errors = validatePassword(password);
        errorBox.textContent = "";
        if (errors.length) {
          errorBox.textContent = `Password needs ${errors.join(", ")}.`;
          return;
        }
        button.disabled = true;
        button.textContent = "Resetting...";
        try {
          await api("confirm-reset", { email, code, password });
          renderLogin("Password reset complete. You can sign in now.");
        } catch (error) {
          errorBox.textContent = "Password reset could not be completed.";
          button.disabled = false;
          button.textContent = "Reset password";
        }
      }

      async function signOut() {
        await api("logout", {});
        renderLogin("You have signed out.");
      }

      async function api(path, payload) {
        const response = await fetch(`${API_BASE}/${path}`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {}),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.message || "Request failed");
          error.payload = data;
          throw error;
        }
        return data;
      }

      function validatePassword(password) {
        const checks = [];
        if (password.length < 14) checks.push("14 characters");
        if (!/[A-Z]/.test(password)) checks.push("an uppercase letter");
        if (!/[a-z]/.test(password)) checks.push("a lowercase letter");
        if (!/[0-9]/.test(password)) checks.push("a number");
        if (!/[^A-Za-z0-9]/.test(password)) checks.push("a symbol");
        return checks;
      }

      function firstNameOf(value) {
        return String(value || "Member").trim().split(/\s+/)[0] || "Member";
      }

      function normalizeTier(value) {
        return String(value || "free").trim().toLowerCase().replace(/_/g, "-");
      }

      function tierLabelFor(tier) {
        const labels = {
          subscriber: "Subscriber",
          free: "Subscriber",
          club: "Club",
          premier: "Premier",
          patron: "Patron",
          founder: "Founder",
          tester: "Tester",
        };
        return labels[tier] || titleCase(tier || "member");
      }

      function tierDescription(tier) {
        const descriptions = {
          subscriber: "Your membership is active at the Subscriber level.",
          free: "Your membership is active at the Subscriber level.",
          club: "Your Club membership is active.",
          premier: "Your Premier membership is active.",
          patron: "Your Patron membership is active.",
          founder: "Your Founder identity is active. Founder-specific controls follow in the dedicated Founder step.",
          tester: "Your Tester membership is active.",
        };
        return descriptions[tier] || "Your Presttige membership is active.";
      }

      function statusLabel(value) {
        const status = String(value || "").trim().toLowerCase();
        if (status === "active") return "Active";
        if (status === "password_pending") return "Complete setup";
        return titleCase(status || "Active");
      }

      function profileOf(member) {
        const profile = member?.profile || {};
        return {
          name: profile.name || member?.name || "",
          email: profile.email || member?.email || "",
          phone_country: profile.phone_country || "",
          phone: profile.phone || "",
          age: profile.age || "",
          country: profile.country || "",
          city: profile.city || "",
          occupation: profile.occupation || "",
          company: profile.company || "",
          website: profile.website || "",
          linkedin: profile.linkedin || "",
          instagram: profile.instagram || "",
          tiktok: profile.tiktok || "",
          bio: profile.bio || "",
        };
      }

      function interestsOf(member) {
        const interests = member?.interests || {};
        return {
          lifestyle: interests.lifestyle || "",
          business: interests.business || "",
          travel: interests.travel || "",
          culture: interests.culture || "",
          wellbeing: interests.wellbeing || "",
          notes: interests.notes || "",
        };
      }

      function readFormValue(id) {
        return String(document.getElementById(id)?.value || "").trim();
      }

      function isHttpUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "https:" || url.protocol === "http:";
        } catch (error) {
          return false;
        }
      }

      function titleCase(value) {
        return String(value || "")
          .split(/[_\s-]+/)
          .filter(Boolean)
          .map((segment) => segment.charAt(0).toUpperCase() + segment.slice(1))
          .join(" ");
      }

      function safeFilePart(value) {
        return String(value || "member")
          .toLowerCase()
          .replace(/[^a-z0-9_-]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 80) || "member";
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }
    })();
  </script>
</body>
</html>
