<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presttige Member Login</title>
  <script src="/assets/js/consent-banner.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pp-black: #0A0A0A;
      --pp-gold: #8C7040;
      --pp-paper: #FBF9F4;
      --pp-background: #F5F2ED;
      --pp-hairline: #D8D1C3;
      --pp-muted: #5F5B54;
      --pp-error: #8B1E1E;
      --pp-success-tint: rgba(140, 112, 64, 0.08);
      --pp-error-tint: rgba(139, 30, 30, 0.08);
      --pp-shadow: 0 24px 60px rgba(10, 10, 10, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1cm;
      background:
        radial-gradient(circle at top left, rgba(140, 112, 64, 0.06), transparent 28%),
        linear-gradient(180deg, #F8F5EF 0%, var(--pp-background) 100%);
      color: var(--pp-black);
      font-family: "Source Serif 4", Georgia, serif;
    }

    .shell {
      width: min(100%, 1040px);
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid var(--pp-hairline);
      background: var(--pp-paper);
      box-shadow: var(--pp-shadow);
    }

    .intro {
      padding: 34px 30px;
    }

    .form-panel {
      padding: 34px 30px;
    }

    .brand-mark {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid rgba(140, 112, 64, 0.42);
      color: var(--pp-gold);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 58px;
      font-style: italic;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--pp-gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .title {
      margin: 0 0 18px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(42px, 6vw, 66px);
      font-style: italic;
      font-weight: 500;
      line-height: 0.96;
    }

    .copy {
      margin: 0;
      color: var(--pp-muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .form {
      display: grid;
      gap: 18px;
      margin-top: 26px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--pp-gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--pp-hairline);
      border-radius: 0;
      background: #fffdf8;
      color: var(--pp-black);
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 18px;
      border: 1px solid var(--pp-gold);
      background: var(--pp-gold);
      color: var(--pp-paper);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .button--secondary {
      background: transparent;
      color: var(--pp-gold);
    }

    .link-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--pp-gold);
      font: inherit;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }

    .notice,
    .failure {
      margin-top: 22px;
      padding: 16px 18px;
      font-size: 14px;
      line-height: 1.65;
    }

    .notice {
      border: 1px solid rgba(140, 112, 64, 0.18);
      background: var(--pp-success-tint);
      color: var(--pp-black);
    }

    .failure {
      border: 1px solid rgba(139, 30, 30, 0.2);
      background: var(--pp-error-tint);
      color: var(--pp-error);
    }

    .hint {
      margin: 0;
      color: var(--pp-muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .error-text {
      color: var(--pp-error);
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel intro">
      <div class="brand-mark" aria-hidden="true">P</div>
      <p class="eyebrow">Presttige Members</p>
      <h1 class="title">Private access.</h1>
      <p class="copy">Sign in with the email and password attached to your Presttige member account.</p>
    </section>
    <section id="app" class="panel form-panel" aria-live="polite">
      <p class="eyebrow">Member Login</p>
      <h2 class="title">Checking session.</h2>
      <p class="copy">Hold for a moment while we prepare the private login.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      const API_BASE = window.location.hostname === "localhost"
        ? "https://rwkz3d86u0.execute-api.us-east-1.amazonaws.com/member-auth"
        : "/member-api";
      const app = document.getElementById("app");

      loadSession();

      async function loadSession() {
        try {
          const session = await api("session", {});
          if (session.ok) {
            renderActive(session.member);
            return;
          }
        } catch (error) {
          if (error.payload?.status === "PASSWORD_PENDING") {
            renderPasswordPending(error.payload);
            return;
          }
        }
        renderLogin();
      }

      function renderLogin(message) {
        app.innerHTML = `
          <p class="eyebrow">Member Login</p>
          <h2 class="title">Enter Presttige.</h2>
          <p class="copy">Use the member account created after your membership was confirmed.</p>
          ${message ? `<div class="notice">${escapeHtml(message)}</div>` : ""}
          <form id="login-form" class="form" novalidate>
            <div class="field">
              <label for="member-email">Email</label>
              <input id="member-email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="member-password">Password</label>
              <input id="member-password" type="password" autocomplete="current-password" required>
            </div>
            <p id="login-error" class="hint error-text"></p>
            <div class="actions">
              <button id="login-submit" class="button" type="submit">Sign in</button>
              <button class="link-button" type="button" data-forgot>Forgot password</button>
            </div>
          </form>
        `;
        document.getElementById("login-form").addEventListener("submit", submitLogin);
        app.querySelector("[data-forgot]").addEventListener("click", renderForgot);
      }

      async function submitLogin(event) {
        event.preventDefault();
        const email = document.getElementById("member-email").value.trim();
        const password = document.getElementById("member-password").value;
        const errorBox = document.getElementById("login-error");
        const button = document.getElementById("login-submit");
        errorBox.textContent = "";
        button.disabled = true;
        button.textContent = "Signing in...";

        try {
          const result = await api("login", { email, password });
          renderActive(result.member);
        } catch (error) {
          if (error.payload?.status === "PASSWORD_PENDING") {
            renderPasswordPending(error.payload);
            return;
          }
          errorBox.textContent = "Sign-in could not be completed.";
          button.disabled = false;
          button.textContent = "Sign in";
        }
      }

      function renderActive(member) {
        app.innerHTML = `
          <p class="eyebrow">Member Session</p>
          <h2 class="title">You are signed in.</h2>
          <p class="copy">Your Presttige session is active. The member area will open in the next step.</p>
          <div class="notice">
            ${escapeHtml(member?.name || "Member")}<br>
            ${escapeHtml(titleCase(member?.tier || "member"))}
          </div>
          <div class="actions">
            <button id="sign-out" class="button button--secondary" type="button">Sign out</button>
          </div>
        `;
        document.getElementById("sign-out").addEventListener("click", signOut);
      }

      function renderPasswordPending(payload) {
        const activationUrl = payload.activation_url || "";
        app.innerHTML = `
          <p class="eyebrow">Account Setup</p>
          <h2 class="title">Password pending.</h2>
          <p class="copy">Your account setup is not complete yet. Complete the password step before entering the member area.</p>
          <div class="actions">
            ${activationUrl ? `<a class="button" href="${escapeHtml(activationUrl)}">Set password</a>` : ""}
            <button class="button button--secondary" type="button" data-login>Back to login</button>
          </div>
        `;
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
      }

      function renderForgot() {
        app.innerHTML = `
          <p class="eyebrow">Password Reset</p>
          <h2 class="title">Reset access.</h2>
          <p class="copy">Enter your member email. If the account can be reset, instructions will be sent.</p>
          <form id="forgot-form" class="form" novalidate>
            <div class="field">
              <label for="forgot-email">Email</label>
              <input id="forgot-email" type="email" autocomplete="username" required>
            </div>
            <p id="forgot-message" class="hint"></p>
            <div class="actions">
              <button id="forgot-submit" class="button" type="submit">Send reset</button>
              <button class="button button--secondary" type="button" data-login>Back to login</button>
            </div>
          </form>
          <div class="notice">
            Already have a reset code?
            <button class="link-button" type="button" data-reset-code>Enter code</button>
          </div>
        `;
        document.getElementById("forgot-form").addEventListener("submit", submitForgot);
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
        app.querySelector("[data-reset-code]").addEventListener("click", renderResetCode);
      }

      async function submitForgot(event) {
        event.preventDefault();
        const email = document.getElementById("forgot-email").value.trim();
        const message = document.getElementById("forgot-message");
        const button = document.getElementById("forgot-submit");
        button.disabled = true;
        button.textContent = "Sending...";
        try {
          const result = await api("forgot", { email });
          message.textContent = result.message || "If this account can be reset, instructions have been sent.";
        } catch (error) {
          message.textContent = "If this account can be reset, instructions have been sent.";
        } finally {
          button.disabled = false;
          button.textContent = "Send reset";
        }
      }

      function renderResetCode() {
        app.innerHTML = `
          <p class="eyebrow">Password Reset</p>
          <h2 class="title">Enter reset code.</h2>
          <p class="copy">Use the code sent to your email and choose a new password.</p>
          <form id="reset-form" class="form" novalidate>
            <div class="field">
              <label for="reset-email">Email</label>
              <input id="reset-email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="reset-code">Reset code</label>
              <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
            </div>
            <div class="field">
              <label for="reset-password">New password</label>
              <input id="reset-password" type="password" autocomplete="new-password" minlength="14" required>
              <p class="hint">Use at least 14 characters, with uppercase, lowercase, a number and a symbol.</p>
            </div>
            <p id="reset-error" class="hint error-text"></p>
            <div class="actions">
              <button id="reset-submit" class="button" type="submit">Reset password</button>
              <button class="button button--secondary" type="button" data-login>Back to login</button>
            </div>
          </form>
        `;
        document.getElementById("reset-form").addEventListener("submit", submitReset);
        app.querySelector("[data-login]").addEventListener("click", () => renderLogin());
      }

      async function submitReset(event) {
        event.preventDefault();
        const email = document.getElementById("reset-email").value.trim();
        const code = document.getElementById("reset-code").value.trim();
        const password = document.getElementById("reset-password").value;
        const errorBox = document.getElementById("reset-error");
        const button = document.getElementById("reset-submit");
        const errors = validatePassword(password);
        errorBox.textContent = "";
        if (errors.length) {
          errorBox.textContent = `Password needs ${errors.join(", ")}.`;
          return;
        }
        button.disabled = true;
        button.textContent = "Resetting...";
        try {
          await api("confirm-reset", { email, code, password });
          renderLogin("Password reset complete. You can sign in now.");
        } catch (error) {
          errorBox.textContent = "Password reset could not be completed.";
          button.disabled = false;
          button.textContent = "Reset password";
        }
      }

      async function signOut() {
        await api("logout", {});
        renderLogin("You have signed out.");
      }

      async function api(path, payload) {
        const response = await fetch(`${API_BASE}/${path}`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {}),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.message || "Request failed");
          error.payload = data;
          throw error;
        }
        return data;
      }

      function validatePassword(password) {
        const checks = [];
        if (password.length < 14) checks.push("14 characters");
        if (!/[A-Z]/.test(password)) checks.push("an uppercase letter");
        if (!/[a-z]/.test(password)) checks.push("a lowercase letter");
        if (!/[0-9]/.test(password)) checks.push("a number");
        if (!/[^A-Za-z0-9]/.test(password)) checks.push("a symbol");
        return checks;
      }

      function titleCase(value) {
        return String(value || "")
          .split(/[_\s-]+/)
          .filter(Boolean)
          .map((segment) => segment.charAt(0).toUpperCase() + segment.slice(1))
          .join(" ");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    })();
  </script>
</body>
</html>
