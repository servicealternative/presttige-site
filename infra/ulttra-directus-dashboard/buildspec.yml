version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
  build:
    commands:
      - |
        BUILD_ARGS=()
        if [ -n "${DIRECTUS_BASE_IMAGE:-}" ]; then
          BUILD_ARGS+=(--build-arg "DIRECTUS_BASE_IMAGE=$DIRECTUS_BASE_IMAGE")
        fi
        docker build "${BUILD_ARGS[@]}" -t "$IMAGE_URI" .
  post_build:
    commands:
      - docker push "$IMAGE_URI"
      - printf '{"imageUri":"%s"}' "$IMAGE_URI" > image-detail.json

artifacts:
  files:
    - image-detail.json
